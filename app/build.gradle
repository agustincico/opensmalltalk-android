apply plugin: 'com.android.application'

android {
    // The R class / resources package. Kept as the fork's original Java package
    // (the sources live there); the PUBLIC identity is applicationId below.
    namespace 'au.com.darkside.x11server'

    compileSdk 35
    ndkVersion "26.2.11394342"

    defaultConfig {
        applicationId "ar.com.opensmalltalk"
        // The VM is cross-compiled against Bionic API 28: nl_langinfo arrived in
        // 26 and glob()/globfree() in 28, and the plugins call both. This used to
        // say 22 while every shipped .so declared 24, so the floor was fiction --
        // now it matches the binaries. See docs/BUILDING-VM.md.
        minSdkVersion 28
        // Google Play requires new apps/updates to target API 35 (Android 15).
        targetSdk 35
        versionCode 43
        versionName "1.43"

        ndk {
            // arm64 only: libsqueak.so (the VM) exists for arm64-v8a alone, so an
            // armeabi-v7a/x86_64 install could never run an image — shipping them
            // only lets Play offer the app to devices where it cannot work.
            abiFilters 'arm64-v8a'
        }
    }

    // Release signing is configured OUTSIDE the repo. Copy keystore.properties.example
    // to app/keystore.properties (gitignored) and fill in your own keystore. Without
    // it `assembleRelease` still builds — just unsigned — so a fresh clone works.
    // (Credentials used to be hardcoded here, which both leaked them and made the
    // release build impossible for anyone without that exact .jks.)
    def keystorePropsFile = file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            pickFirsts += ['lib/*/libc++_shared.so']
            // The prebuilt VM/plugins must not be stripped: they are shipped as
            // built (and stripping them here would also rewrite their ELF layout).
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    implementation project(":library")
    implementation fileTree(dir: "libs", include: ["*.jar"])
}
