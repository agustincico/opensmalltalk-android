// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.x is required to target the API level Play demands (36 since
        // September 2026) and to get 16 KB-page-aware packaging. It needs JDK 17 and
        // Gradle 8.13 (wrapper). Play's console suggests AGP 9.0; there is no stable
        // 9.0 yet, so 8.13.2 is as new as this can be.
        classpath 'com.android.tools.build:gradle:8.13.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
